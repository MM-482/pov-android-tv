name: Android preview

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    name: Debug APK, unit tests, and lint
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap verified project-local Android tools
        run: .\scripts\bootstrap.ps1

      - name: Build debug APK, run unit tests, and run lint
        # AGP unit-test paths must stay on the checkout's Windows drive.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: .\scripts\build.ps1

      - name: Save debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cameo-debug-apk-${{ github.sha }}
          path: ${{ env.POV_BUILD_OUTPUT }}/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cameo-unit-tests-${{ github.sha }}
          path: |
            ${{ env.POV_BUILD_OUTPUT }}/test-results/testDebugUnitTest/
            ${{ env.POV_BUILD_OUTPUT }}/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cameo-lint-${{ github.sha }}
          path: ${{ env.POV_BUILD_OUTPUT }}/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

